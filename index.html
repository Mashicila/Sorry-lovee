<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

.box {
    background: white;
    padding: 35px;
    border-radius: 25px;
    width: 80%;
    max-width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: pop 1s ease;
    z-index: 2;
}

h1 {
    color: #ff3366;
}

p {
    color: #555;
    font-size: 18px;
    line-height: 1.6;
}

.heart {
    font-size: 65px;
    animation: beat 1s infinite;
}

button {
    background: #ff3366;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 25px;
    font-size: 17px;
    cursor: pointer;
}

@keyframes beat {
    50% { transform: scale(1.3); }
}

@keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
}

.floating {
    position: absolute;
    bottom: -50px;
    animation: float 6s linear infinite;
    font-size: 25px;
}

@keyframes float {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="box">
    <div class="heart">❤️</div>

    <h1>I'm Sorry 🥺</h1>

    <p>
        I know things haven't been perfect,
        but I want you to know that
        I'm truly sorry. 💔
        <br><br>
        I miss you so much.
        I miss your smile, your presence
        and everything about you. 😔❤️
        <br><br>
        I wish I could make things right.
        You mean more to me than words can explain. 🥺
    </p>

    <h2>❤️ I MISS YOU ❤️</h2>

    <button onclick="alert('Sending you the biggest hug! 🤗❤️')">
        Click for a hug 🥺
    </button>
</div>

<script>
const emojis = ["❤️", "💕", "💗", "💔", "🥺", "😢"];

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating";
    heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random()*4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
